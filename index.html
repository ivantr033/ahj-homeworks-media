<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline - Geolocation & Media Recorder</title><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div id="timeline-root-wrapper"><div class="timeline-main-layout" id="posts-history-viewport"></div><div id="video-preview-stream-holder"><video id="video-live-preview" muted autoplay></video></div><div class="timeline-footer-bar"><input id="timeline-core-input" class="timeline-input-element" placeholder="Type your message here and press Enter..."/><div class="hardware-actions-group" id="standard-icons-group"><button class="icon-action-btn" id="btn-trigger-audio-rec" title="Record Audio">🎙️</button> <button class="icon-action-btn" id="btn-trigger-video-rec" title="Record Video">📷</button></div><div class="recorder-panel-active" id="active-recorder-controls"><button class="icon-action-btn btn-confirm-record" id="btn-save-recording" title="Save">✓</button><div class="timer-counter" id="live-timer-display">00:00</div><button class="icon-action-btn btn-cancel-record" id="btn-cancel-recording" title="Cancel">✕</button></div></div></div><div id="geo-modal-overlay"><div class="geo-modal-box"><div class="modal-header-err">Что-то пошло не так</div><div class="modal-body-desc">К сожалению, нам не удалось определить ваше местоположение, пожалуйста, дайте разрешение на использование геолокации, либо введите координаты вручную.</div><label class="modal-input-label">Широта и долгота через запятую</label> <input id="manual-coords-input" class="modal-geo-input" placeholder="51.50851, -0.12572" autocomplete="off"/><div id="geo-input-error-msg" class="input-error-tip"></div><div class="modal-actions-footer"><button class="modal-btn" id="btn-close-geo-modal">Отмена</button> <button class="modal-btn btn-ok" id="btn-submit-geo-manual">OK</button></div></div></div></body></html>
